name: Build, Sign & Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e ".[dev]"

      - name: Run unit tests
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe tests/unit -o addopts=""

      - name: Build PyInstaller bundle and Inno Setup installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Run self-test on packaged executable
        shell: pwsh
        run: |
          .\tmp\dist\pdf2musescore\pdf2musescore.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Version check failed" }
          .\tmp\dist\pdf2musescore\pdf2musescore.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed" }

      - name: Upload unsigned installer artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: tmp/dist/pdf2musescore-setup.exe

      - name: Submit signing request to SignPath (when configured)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "pdf2musescore"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "tmp/signed"

      - name: Prepare release asset
        shell: pwsh
        run: |
          if (Test-Path "tmp/signed/pdf2musescore-setup.exe") {
            Copy-Item "tmp/signed/pdf2musescore-setup.exe" "tmp/dist/pdf2musescore-setup.exe" -Force
          }

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tmp/dist/pdf2musescore-setup.exe
          generate_release_notes: true
