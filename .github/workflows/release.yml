name: Build, Sign & Release Windows Installer

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_PRODUCT_ID: "9N6NCBWM3BHT"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve versioned artifact filenames
        shell: pwsh
        run: |
          $initText = Get-Content -Path "src/pdf2musescore/__init__.py" -Raw
          if ($initText -notmatch '__version__\s*=\s*"([^"]+)"') {
            throw "Could not parse __version__ from src/pdf2musescore/__init__.py"
          }
          $ver = $Matches[1]
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SETUP_EXE_NAME=pdf2musescore-$ver-setup-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_NAME=pdf2musescore-$ver-x64.msix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e ".[dev]"

      - name: Run unit tests
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe tests/unit -o addopts=""

      - name: Build PyInstaller bundle and Inno Setup installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\packaging\build_msix.ps1

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-package-${{ env.APP_VERSION }}
          path: tmp/dist/${{ env.MSIX_NAME }}

      - name: Run packaging integration test (--version, --self-test, size check)
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe tests/integration/test_packaging.py -o addopts=""

      - name: Upload unsigned installer artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ env.APP_VERSION }}
          path: tmp/dist/${{ env.SETUP_EXE_NAME }}

      - name: Submit signing request to SignPath (when configured)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "pdf2musescore"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "tmp/signed"

      - name: Prepare release asset
        shell: pwsh
        run: |
          if (Test-Path "tmp/signed/$env:SETUP_EXE_NAME") {
            Copy-Item "tmp/signed/$env:SETUP_EXE_NAME" "tmp/dist/$env:SETUP_EXE_NAME" -Force
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @(
            "tmp/dist/$env:SETUP_EXE_NAME",
            "tmp/dist/$env:MSIX_NAME"
          ) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $_
            "$hash  $name"
          }
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("tmp/dist/SHA256SUMS.txt", $text, [System.Text.UTF8Encoding]::new($false))
          Get-Content "tmp/dist/SHA256SUMS.txt"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tmp/dist/${{ env.SETUP_EXE_NAME }}

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp/dist/${{ env.SETUP_EXE_NAME }}
            tmp/dist/${{ env.MSIX_NAME }}
            tmp/dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Setup Microsoft Store Developer CLI (when configured)
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.MSSTORE_TENANT_ID != '' &&
          env.MSSTORE_CLIENT_ID != '' &&
          env.MSSTORE_CLIENT_SECRET != '' &&
          env.MSSTORE_SELLER_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish MSIX to Microsoft Store (when configured)
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.MSSTORE_TENANT_ID != '' &&
          env.MSSTORE_CLIENT_ID != '' &&
          env.MSSTORE_CLIENT_SECRET != '' &&
          env.MSSTORE_SELLER_ID != ''
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "$env:MSSTORE_TENANT_ID" `
            --sellerId "$env:MSSTORE_SELLER_ID" `
            --clientId "$env:MSSTORE_CLIENT_ID" `
            --clientSecret "$env:MSSTORE_CLIENT_SECRET"
          msstore publish "tmp/dist/$env:MSIX_NAME" -id "$env:MSSTORE_PRODUCT_ID"
