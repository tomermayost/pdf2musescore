name: Build, Sign & Release Windows Installer

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      MSSTORE_PRODUCT_ID: "9N6NCBWM3BHT"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e ".[dev]"

      - name: Run unit tests
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe tests/unit -o addopts=""

      - name: Build PyInstaller bundle and Inno Setup installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\packaging\build_msix.ps1

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-package
          path: tmp/dist/pdf2musescore.msix

      - name: Run packaging integration test (--version, --self-test, size check)
        shell: pwsh
        run: |
          .\.venv\Scripts\pytest.exe tests/integration/test_packaging.py -o addopts=""

      - name: Upload unsigned installer artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: tmp/dist/pdf2musescore-setup.exe

      - name: Submit signing request to SignPath (when configured)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: "pdf2musescore"
          signing-policy-slug: "release-signing"
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: "tmp/signed"

      - name: Prepare release asset
        shell: pwsh
        run: |
          if (Test-Path "tmp/signed/pdf2musescore-setup.exe") {
            Copy-Item "tmp/signed/pdf2musescore-setup.exe" "tmp/dist/pdf2musescore-setup.exe" -Force
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @(
            "tmp/dist/pdf2musescore-setup.exe",
            "tmp/dist/pdf2musescore.msix"
          ) | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $_
            "$hash  $name"
          }
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("tmp/dist/SHA256SUMS.txt", $text, [System.Text.UTF8Encoding]::new($false))
          Get-Content "tmp/dist/SHA256SUMS.txt"

      - name: Generate GitHub build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: tmp/dist/pdf2musescore-setup.exe

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tmp/dist/pdf2musescore-setup.exe
            tmp/dist/pdf2musescore.msix
            tmp/dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Setup Microsoft Store Developer CLI (when configured)
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.MSSTORE_TENANT_ID != '' &&
          env.MSSTORE_CLIENT_ID != '' &&
          env.MSSTORE_CLIENT_SECRET != '' &&
          env.MSSTORE_SELLER_ID != ''
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish MSIX to Microsoft Store (when configured)
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          env.MSSTORE_TENANT_ID != '' &&
          env.MSSTORE_CLIENT_ID != '' &&
          env.MSSTORE_CLIENT_SECRET != '' &&
          env.MSSTORE_SELLER_ID != ''
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "$env:MSSTORE_TENANT_ID" `
            --sellerId "$env:MSSTORE_SELLER_ID" `
            --clientId "$env:MSSTORE_CLIENT_ID" `
            --clientSecret "$env:MSSTORE_CLIENT_SECRET"
          msstore publish "tmp/dist/pdf2musescore.msix" -id "$env:MSSTORE_PRODUCT_ID"
