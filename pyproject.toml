[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2musescore"
version = "0.2.0"
description = "Minimal Windows desktop app converting sheet-music PDFs to MusicXML / MuseScore using homr AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "homr>=0.6.2",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
pdf2musescore = "pdf2musescore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=pdf2musescore --cov-report=term-missing --cov-report=html:tmp/coverage_html --cov-fail-under=85"
markers = [
    "integration: tests requiring real external tools (homr / MuseScore)",
]

[tool.coverage.run]
branch = true
source = ["pdf2musescore"]
data_file = "tmp/.coverage"
