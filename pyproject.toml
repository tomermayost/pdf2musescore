[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2musescore"
version = "0.6.0"
description = "Minimal Windows desktop app converting sheet-music PDFs to MusicXML / MuseScore using homr AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Tomer Mayost" }]
keywords = [
    "musescore",
    "sheet-music",
    "omr",
    "optical-music-recognition",
    "musicxml",
    "pdf",
    "homr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "homr[cpu]>=0.7.1",
    "Pillow>=10.0",
    "pypdfium2>=4.0",
]

[project.urls]
Homepage = "https://tomermayost.github.io/pdf2musescore/"
"Microsoft Store" = "https://apps.microsoft.com/detail/9N6NCBWM3BHT"
Repository = "https://github.com/tomermayost/pdf2musescore"
Issues = "https://github.com/tomermayost/pdf2musescore/issues"
Releases = "https://github.com/tomermayost/pdf2musescore/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
]

[project.gui-scripts]
pdf2musescore = "pdf2musescore.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2musescore = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=pdf2musescore --cov-report=term-missing --cov-report=html:tmp/coverage_html --cov-fail-under=85"
markers = [
    "integration: tests requiring real external tools (homr / MuseScore)",
]

[tool.coverage.run]
branch = true
source = ["pdf2musescore"]
data_file = "tmp/.coverage"
